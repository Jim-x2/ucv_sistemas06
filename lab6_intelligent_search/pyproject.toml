[project]
name = "lab6-intelligent-search"
version = "0.1.0"
description = ""
authors = [
    {name = "Jimmy Chamorro Ayala",email = "TU_CORREO@gmail.com"}
]
requires-python = ">=3.13,<3.14.1 || >3.14.1,<3.15"
dependencies = [
    "networkx (<3.7)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic (>=2.14.0,<3.0.0)",
    "pgmpy (>=1.1.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
[tool.poetry]
packages = [{ include = "lab6_intelligent_search", from = "src" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]